<!DOCTYPE html>
<html>
<head>
    <title>Simple File Editor</title>
</head>
<body>
    <h1>Simple File Editor</h1>

    <form action="/write/" method="post">
        <label for="line">Enter a new line:</label><br>
        <input type="text" id="line" name="line"><br><br>
        <input type="submit" value="Add Line">
    </form>

    {% if message %}
    <p><strong>{{ message }}</strong></p>
    {% endif %}

    <h2>Current File Contents:</h2>
    <pre>{{ file_contents }}</pre>
</body>
</html>
